    <circle cx="400" cy="220" r="128" fill="#7773e6" fill-opacity=".12" stroke="#5b5ce2" stroke-width="7"/>
    <path d="M400 220h128M400 92v256" stroke="#7773de" stroke-width="4" stroke-dasharray="10 10"/>
