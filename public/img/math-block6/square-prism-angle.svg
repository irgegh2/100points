<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Диагонали DB1 и AC1 в правильной четырёхугольной призме</title>
  <desc id="desc">В призме выделены диагонали DB1 и AC1, угол между которыми требуется найти.</desc>
  <rect x="2" y="2" width="796" height="436" rx="26" fill="#f7f7fc" stroke="#dedee9" stroke-width="4"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 338H520L610 228H295L205 338ZM205 338V130H520V338M520 130 610 28V228M205 130 295 28H610M295 28V228" stroke="#9b98bd" stroke-width="5"/>
    <path d="M295 228 520 130" stroke="#ef5f86" stroke-width="9"/>
    <path d="M205 338 610 28" stroke="#5b5ce2" stroke-width="9"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#242238" font-size="22" font-weight="850">
    <text x="180" y="366">A</text><text x="525" y="368">B</text><text x="620" y="242">C</text><text x="273" y="252">D</text>
