<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Прямоугольный параллелепипед ABCDA₁B₁C₁D₁</title>
  <desc id="desc">Прямоугольный параллелепипед с отмеченной пунктиром диагональю BD₁.</desc>
  <defs>
    <pattern id="smallGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#b9b9b9" stroke-width="1.5"/>
    </pattern>
    <pattern id="grid" width="170" height="170" patternUnits="userSpaceOnUse">
      <rect width="170" height="170" fill="url(#smallGrid)"/>
      <path d="M170 0H0V170" fill="none" stroke="#8f8f8f" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1100" height="720" fill="#fff"/>
  <rect width="1100" height="720" fill="url(#grid)"/>

  <g fill="none" stroke="#5554dd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M145 620H790L975 455V90H330L145 250V620Z"/>
