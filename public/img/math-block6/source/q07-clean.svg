    <path d="M330 90V455H975M330 455 145 620M330 90 790 620"/>
  </g>

  <g fill="#191925" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-style="italic">
    <text x="104" y="682">A</text>
    <text x="800" y="682">B</text>
    <text x="990" y="476">C</text>
    <text x="272" y="478">D</text>
    <text x="90" y="270">A₁</text>
    <text x="802" y="270">B₁</text>
    <text x="986" y="90">C₁</text>
    <text x="270" y="82">D₁</text>
  </g>
</svg>
