<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img" aria-labelledby="title desc">
  <title id="title">Дерево вероятностей для проверки батарейки</title>
  <desc id="desc">Батарейка может быть исправной или неисправной, после чего система контроля бракует её или пропускает.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f5ff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#343070" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="976" height="586" rx="26" fill="url(#bg)" stroke="#dedbea" stroke-width="4"/>
  <g fill="none" stroke="#6a67db" stroke-width="6" stroke-linecap="round">
    <path d="M490 104 265 226"/>
    <path d="M490 104 715 226"/>
    <path d="M265 284 150 430"/>
    <path d="M265 284 378 430"/>
    <path d="M715 284 602 430"/>
    <path d="M715 284 830 430"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="386" y="44" width="208" height="72" rx="22" fill="#5552d9"/>
    <text x="490" y="89" fill="white" font-size="27" font-weight="800">Батарейка</text>
    <rect x="155" y="222" width="220" height="74" rx="22" fill="white"/>
    <text x="265" y="268" fill="#242238" font-size="26" font-weight="800">Исправна</text>
    <rect x="605" y="222" width="220" height="74" rx="22" fill="white"/>
    <text x="715" y="268" fill="#242238" font-size="26" font-weight="800">Неисправна</text>
  </g>
  <g fill="#4f4cc2" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800">
    <text x="322" y="152">0,85</text>
    <text x="625" y="152">0,15</text>
    <text x="158" y="350">0,01</text>
    <text x="343" y="350">0,99</text>
    <text x="596" y="350">0,88</text>
    <text x="789" y="350">0,12</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <circle cx="150" cy="442" r="14" fill="#ef5b72"/>
    <circle cx="378" cy="442" r="14" fill="#42b883"/>
    <circle cx="602" cy="442" r="14" fill="#ef5b72"/>
    <circle cx="830" cy="442" r="14" fill="#42b883"/>
    <text x="150" y="492" fill="#b53148" font-size="25" font-weight="800">Брак</text>
    <text x="378" y="492" fill="#267452" font-size="25" font-weight="800">Не брак</text>
    <text x="602" y="492" fill="#b53148" font-size="25" font-weight="800">Брак</text>
    <text x="830" y="492" fill="#267452" font-size="25" font-weight="800">Не брак</text>
  </g>
  <rect x="116" y="526" width="520" height="40" rx="20" fill="#fff" opacity=".85"/>
  <text x="136" y="553" fill="#494667" font-family="Inter,Arial,sans-serif" font-size="20">Искомые ветви: исправна → брак и неисправна → брак</text>
</svg>
