<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-labelledby="title desc">
  <title id="title">События для массы буханки</title>
  <desc id="desc">На числовой прямой отмечены 790 и 810 граммов, выделен искомый промежуток.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7470a3"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="916" height="286" rx="24" fill="url(#bg)" stroke="#dedbea" stroke-width="4"/>
  <text x="48" y="49" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Масса буханки, г</text>
  <line x1="92" y1="185" x2="832" y2="185" stroke="#7470a3" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="350" y1="185" x2="642" y2="185" stroke="#5b5ce2" stroke-width="14" stroke-linecap="round"/>
  <circle cx="350" cy="185" r="14" fill="#f7f6ff" stroke="#5b5ce2" stroke-width="8"/>
  <circle cx="642" cy="185" r="14" fill="#f7f6ff" stroke="#5b5ce2" stroke-width="8"/>
  <text x="330" y="238" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">790</text>
  <text x="622" y="238" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">810</text>
  <path d="M350 130 C225 82 154 86 100 116" fill="none" stroke="#8f8bb3" stroke-width="5" stroke-linecap="round"/>
  <path d="M350 94 C527 39 696 45 814 91" fill="none" stroke="#6d69d8" stroke-width="5" stroke-linecap="round"/>
  <text x="99" y="91" fill="#5b577c" font-family="Inter,Arial,sans-serif" font-size="22">P(X ≤ 790) = 0,17</text>
  <text x="614" y="52" fill="#4f4cc2" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">P(X &lt; 810) = 0,98</text>
  <text x="430" y="162" fill="#4542bd" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">790 &lt; X &lt; 810</text>
</svg>
