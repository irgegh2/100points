<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">События для количества пассажиров</title>
  <desc id="desc">На числовой прямой отмечены точки 7 и 13, выделен промежуток от 7 до 13.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7470a3"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="916" height="276" rx="24" fill="url(#bg)" stroke="#dedbea" stroke-width="4"/>
  <text x="48" y="48" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Количество пассажиров</text>
  <line x1="94" y1="178" x2="830" y2="178" stroke="#7470a3" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="334" y1="178" x2="640" y2="178" stroke="#5b5ce2" stroke-width="14" stroke-linecap="round"/>
  <circle cx="334" cy="178" r="14" fill="#5b5ce2"/>
  <circle cx="640" cy="178" r="14" fill="#f7f6ff" stroke="#5b5ce2" stroke-width="8"/>
  <text x="326" y="230" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">7</text>
  <text x="625" y="230" fill="#242238" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">13</text>
  <path d="M118 130 C190 82 265 76 334 87" fill="none" stroke="#9b98bd" stroke-width="5" stroke-linecap="round"/>
  <path d="M118 112 C284 36 480 35 640 78" fill="none" stroke="#6d69d8" stroke-width="5" stroke-linecap="round"/>
  <text x="116" y="92" fill="#5b577c" font-family="Inter,Arial,sans-serif" font-size="22">P(X &lt; 7) = 0,95</text>
  <text x="514" y="49" fill="#4f4cc2" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">P(X &lt; 13) = 0,97</text>
  <text x="406" y="155" fill="#4542bd" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">нужный промежуток</text>
</svg>
